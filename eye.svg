<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" width="100%" height="260">
  <style>
    .bg { fill: #0d1117; }
    .ascii {
      fill: #f0f6fc;
      font-family: 'Fira Code', 'Courier New', monospace;
      font-size: 13px;
      white-space: pre;
      letter-spacing: 0.5px;
    }
    @keyframes blink-open {
      0%, 42%, 52%, 100% { opacity: 1; }
      44%, 50% { opacity: 0; }
    }
    @keyframes blink-half {
      0%, 42%, 46%, 48%, 52%, 100% { opacity: 0; }
      44%, 50% { opacity: 1; }
    }
    @keyframes blink-closed {
      0%, 45%, 49%, 100% { opacity: 0; }
      46%, 48% { opacity: 1; }
    }
    .frame-open { animation: blink-open 5s infinite; }
    .frame-half { animation: blink-half 5s infinite; }
    .frame-closed { animation: blink-closed 5s infinite; }
  </style>

  <rect class="bg" width="100%" height="100%" rx="6" />

  <!-- Frame 1: Ouvert -->
  <g class="frame-open">
    <text x="50%" y="45" text-anchor="middle" class="ascii">
      <tspan x="50%" dy="0">               _..---========---.._               </tspan>
      <tspan x="50%" dy="16">           _.-'    _..--------.._    '-._           </tspan>
      <tspan x="50%" dy="16">        .-'     .-'   .------.   '-.     '-.        </tspan>
      <tspan x="50%" dy="16">      .'      .'    .'  .--.  '.    '.      '.      </tspan>
      <tspan x="50%" dy="16">     /       /     /   / () \   \     \       \     </tspan>
      <tspan x="50%" dy="16">    ;       ;     ;   ;  42  ;   ;     ;       ;    </tspan>
      <tspan x="50%" dy="16">     \       \     \   \    /   /     /       /     </tspan>
      <tspan x="50%" dy="16">      '.      '.    '.  '--'  .'    .'      .'      </tspan>
      <tspan x="50%" dy="16">        '-.     '-.   '------'   .-'     .-'        </tspan>
      <tspan x="50%" dy="16">           '-._    '-.________.-'    _.-'           </tspan>
      <tspan x="50%" dy="16">               '--..____________..--'               </tspan>
    </text>
  </g>

  <!-- Frame 2: Mi-clos -->
  <g class="frame-half">
    <text x="50%" y="45" text-anchor="middle" class="ascii">
      <tspan x="50%" dy="0">                                                    </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
      <tspan x="50%" dy="16">           _..---================---.._           </tspan>
      <tspan x="50%" dy="16">        .-'      _..------------.._      '-.        </tspan>
      <tspan x="50%" dy="16">      .'      .-'    .--------.    '-.      '.      </tspan>
      <tspan x="50%" dy="16">     ;-------;------;---(42)---;------;-------;     </tspan>
      <tspan x="50%" dy="16">      '.      '-.    '--------'    .-'      .'      </tspan>
      <tspan x="50%" dy="16">        '-.      '-..____________..-'      .-'        </tspan>
      <tspan x="50%" dy="16">           '--..____________________..--'           </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
    </text>
  </g>

  <!-- Frame 3: Fermé -->
  <g class="frame-closed">
    <text x="50%" y="45" text-anchor="middle" class="ascii">
      <tspan x="50%" dy="0">                                                    </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
      <tspan x="50%" dy="16">        _..---========================---.._        </tspan>
      <tspan x="50%" dy="16">     .-'____________________________________'-.     </tspan>
      <tspan x="50%" dy="16">        '-.  ||   ||    ||    ||   ||  .-'        </tspan>
      <tspan x="50%" dy="16">           '--..____________________..--'           </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
      <tspan x="50%" dy="16">                                                    </tspan>
    </text>
  </g>
</svg>
